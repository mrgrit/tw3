  instruction: '## 🎯 RED-06 — 표면 그리기 — 흩어진 결과가 무기가 되는 순간


    **전투 맥락:** 정찰의 산출물은 "열린 포트 목록"이 아니라 **노릴 게 있는 곳의 목록**이다. 포트 + vhost + 예상 취약점 태그를
    한 장의 표로 통합하는 순간, 정찰은 끝나고 무기가 시작된다.


    **왜:** 결과가 흩어지면 아무도 못 쏜다. " dvwa 봤어, juice 봤어, 포트 6개 열려 있어"가 머릿속에만 있으면 다음주차엔 전부
    잊혀 있다. 표로 둔 글에서만 다음 사람이(또는 다음 주의 너)를 계승 가능하다.


    ## 💻 실행 명령 (한 줄씩 따라 실행)


    **공격 VM:** 192.168.0.202에서, 또는 아무 셸에서 정리한다.

    ```bash

    echo "공개 포트(open): 80/443(HTTP/S), 8001-8007(앱 포트). 9100(API)은 외부 attacker(192.168.0.202)엔
    filtered(미도달)"

    echo "웹 vhost: dvwa.el34.lab(SQLi/XSS), juice.el34.lab(modern), neobank/mediforum/govportal..."

    ```

    - 각 진입점 옆에 **예상 취약점 태그**를 붙여라 — `dvwa→SQLi/XSS`, `neobank→IDOR` 식.

    - 이 표가 **PTES ③ 위협 모델링 + ④ 취약점 분석**의 문서로 직접 들어간다.

    ## ✅ 합격 기준

    `vhost` 출력. **근거:** 포트와 vhost가 "예상 익스플로잇 후보가 명시된" 표면 목록으로 정리되면 통과. 넓게 매핑할수록 침투
    기회가 많다.


    🔥 **실전**: W02 이후 모든 공격의 입력이 이 표다. 표가 없으면 W03의 SQLi도 "어디서 시작할지" 모르는 날로 바뀐다.'
