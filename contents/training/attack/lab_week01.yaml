lab_id: standalone-attack-week01
title: 'RED W01 — 정찰 개시: 네가 보낸 첫 패킷이 이미 공격이다'
version: standalone-attack
course: attack
week: 1
description: "침투 테스트(penetration test)의 첫 단계인 정찰(Reconnaissance)을 RoE(교전 규칙) 안에서 개시한다.\n\
  대상의 도달성을 확인하고, 열린 포트(nmap -p)와 서비스/버전(nmap -sV)을 발견하며, 웹 기술 스택을\n핑거프린팅(whatweb)한\
  \ 뒤, 그 정찰이 방어 스택(Suricata eve.json)에 출처 IP 192.168.0.202 로 어떻게\n탐지되는지 동시에 추적한다(공방\
  \ 통합 — 자기 행동의 탐지를 아는 것이 회피의 출발점). 발견한 포트·vhost를\n공격 표면(attack surface)으로 정리하고 정찰\
  \ 보고서로 종합한다.\n\n**공격 위치 = 실제 외부 공격자 VM `192.168.0.202`(att/1)** — 네 자신의 공격 머신에 SSH\
  \ 로 로그인해\n거기서 도구를 돌린다(`docker exec` 로 남의 컨테이너를 조작하는 게 아니라, 진짜 공격자처럼 내 박스에서\n공격한다).\
  \ **대상 = 공인 진입 `192.168.0.161`** — 이 요청은 FW→IPS(Suricata)→WAF(Apache/ModSec)→앱의\n\
  전 계층을 실제로 통과하고, 내 출처 IP(192.168.0.202)가 각 방어 계층에 그대로 보존된다.\n\n- 공격 실습: `ssh att@192.168.0.202`(비밀번호\
  \ `1`) 로 공격 VM 에 접속해 명령을 실행한다.\n- 방어 가시성(파랑 시선): IPS 장비에 직접 접속한다 — `ssh ccc@10.20.31.2`(비밀번호\
  \ `1`) 후\n  `tail /var/log/suricata/eve.json` 로 Suricata 로그를 본다(공격자→방어자 시선 전환).\n\
  - 인가된 실습 환경(el34)에서만, 제공된 대상(192.168.0.161)에만 수행한다(외부 시도 절대 금지).\n"
difficulty: medium
duration_minutes: 150
prerequisites:
- '공격 VM 접속: ssh att@192.168.0.202 (비밀번호 1) — nmap/whatweb/sqlmap 등 도구 설치됨'
- '방어 가시성 확인용 IPS 장비: ssh ccc@10.20.31.2 (비밀번호 1) — Suricata eve.json'
- lecture §1(PTES/RoE) §3-§5(정찰/가시성) 숙지
objectives:
- PTES 방법론과 RoE 안에서 정찰을 개시한다(인가된 환경 한정)
- 내 공격 VM(192.168.0.202)에서 대상(공인 192.168.0.161) 도달성·열린 포트를 발견한다(nmap -p)
- 서비스/버전을 식별해 CVE 매핑의 출발점을 만든다(nmap -sV)
- 웹 기술 스택을 핑거프린팅하고 vhost별 앱을 구분한다(whatweb)
- 내 정찰의 방어 가시성(Suricata 탐지·출처 192.168.0.202)을 확인한다(공방 시선 전환)
- 발견 자산을 공격 표면으로 매핑하고 정찰 보고서로 종합한다
pass_threshold: 0.7
steps:
- order: 1
  instruction: '## 🎯 RED-01 — 점검 — 내 무기가 있는지, 대상이 살아 있나


    **전투 맥락:** 정찰 개시 전의 마지막 질문이다. 192.168.0.202에 앉아 있잖아. 손에 nmap·whatweb·sqlmap이 있고,
    192.168.0.161이 살아 있는가 — 두 개가 다 패스해야 뒤의 7미션이 의미 있다.


    **왜:** 스캔을 쏘고 실패한 공격자는 두 명뿐이다. 도구가 없거나 대상이 죽어 있다(또는 내 손이 닿지 않는다). 이 한 수로 그 두 가지를
    실행 전에 버린다. 실패 원인을 "내 환경인가 대상인가"로 따로 가를 수 없으면 모든 디버깅이 사냥이 된다.


    ## 💻 실행 명령 (한 줄씩 따라 실행)


    **공격 VM:** `ssh att@192.168.0.202`(비밀번호 `1`)로 로그인 — 이제 실제 외부 공격자의 자리에 선다. 그 VM에서
    아래를 실행한다.

    ```bash

    # 공격 VM(192.168.0.202)에서 실행:

    # 1) 정찰 도구(nmap/whatweb/sqlmap) 설치 경로 확인 — 경로 나오면 설치됨

    ssh att@192.168.0.202 ''which nmap whatweb sqlmap''

    # 2) 대상(공인 진입 192.168.0.161) 도달성 + 지문 — whatweb(dvwa vhost로 분기)

    ssh att@192.168.0.202 ''whatweb -a1 http://dvwa.el34.lab/''

    ```

    > 💡 vhost는 공격 VM의 `/etc/hosts`에 `192.168.0.161 dvwa.el34.lab juice.el34.lab ...`로
    등록되어 있어 `http://dvwa.el34.lab/`처럼 자연 URL로 접속한다. Host 헤더가 자동으로 실린다 — 80번 포트 뒤의
    가게가 **호스트명(간판)**으로 갈린다는 증거는 Red-04에서 직접 확인한다.

    ## ✅ 합격 기준

    `nmap` 출력. **근거:** which가 세 도구의 경로를 뽑고 whatweb이 200/302/403 + Server 헤더를 반환하면
    "도구 정상 + 도달 정상". `000`이면 내 경로가 끊어진 것 — 스캔부터 하면 원인을 분리 못한 채 시간을 태운다.


    🔥 **실전**: 모든 침투의 첫 명령. 이걸 건너뛰면 실패할 때 "나 때문인가 대상 때문인가"를 가를 수 없다.'
  hint: ssh att@192.168.0.202 접속 후 which nmap whatweb sqlmap + whatweb 도달성
  category: survey
  points: 10
  answer: '# 공격 VM(192.168.0.202)에서 실행:

    # 1) 정찰 도구(nmap/whatweb/sqlmap) 설치 경로 확인 — 경로 나오면 설치됨

    ssh att@192.168.0.202 ''which nmap whatweb sqlmap''

    # 2) 대상(공인 진입 192.168.0.161) 도달성 + 지문 — whatweb(dvwa vhost로 분기)

    ssh att@192.168.0.202 ''whatweb -a1 http://dvwa.el34.lab/''

    '
  answer_detail: 정찰 도구(nmap/whatweb/sqlmap)의 설치와 대상(공인 진입 192.168.0.161) 도달성을 확인하는
    것이 침투의 출발점이다. 공격자는 자기 공격 VM(192.168.0.202)에 로그인해 거기서 공격하며(실제 공격자 위치), which 가
    경로를 출력하고 whatweb 이 상태코드+Server 지문을 반환하면 통과로 판정한다.
  expected_output: '/usr/bin/nmap

    /usr/bin/whatweb

    http://dvwa.el34.lab/ [403 Forbidden] Apache[2.4.52], IP[192.168.0.161]

    '
  verify:
    type: output_contains
    expect: nmap
    field: stdout
    semantic:
      intent: 공격 VM 접속 + 도구·대상 도달성 점검
      success_criteria:
      - nmap/whatweb 가용
      - 대상 도달
      acceptable_methods:
      - '**[OSS] which + whatweb 도달성 (권장)**'
  target_vm: web
- order: 2
  instruction: '## 🎯 RED-02 — 문 열기 — 어떤 포트가 열려 있나


    **전투 맥락:** 열린 문이 곧 입구. 대상 건물(192.168.0.161)의 65535개 문 번호 중 열려 있는 것만 노출하는 순간이다
    — 그 목록이 외부 공격 표면 1층이다.


    **왜:** 문을 모르면 노크할 곳도 없다. 실패 부검 — "8003에 SQLi 있다더라"인데 8003이 닫혀 있으면 어디서도 터지지 않는다.
    포트 스캔은 그런 낭비를 실행 전에 없애는 한 수다.


    ## 💻 실행 명령 (한 줄씩 따라 실행)


    **공격 VM:** `ssh att@192.168.0.202` 접속 상태에서 실행한다.

    ```bash

    # 공격 VM(192.168.0.202)에서 실행:

    ssh att@192.168.0.202 ''nmap -p 80,443,8001-8007,9100 192.168.0.161 -T4 --max-retries
    1 2>/dev/null | grep -E "open|PORT"''

    ```

    - `-p 80,443,8001-8007,9100` — 두드릴 문 번호 지정. el34 fw가 DNAT한 공개 포트.

    - `-T4` — 타이밍 템플릿 4. **빠를수록 시끄럽다** — Red-05에서 대가(102건)를 직접 확인한다.

    - `--max-retries 1` — 무응답 문에 재시도 1회로 제한, 스캔을 빨리 끝낸다.

    ## ✅ 합격 기준

    `open` 출력. **근거:** open으로 나온 80/443/8001-8007이 el34의 외부 노출 표면. `9100`은 **filtered**
    — DNAT되어 있어도 외부엔 잠긴 문. "노출 설정 ≠ 실제 도달성"을 실측한 것이다.


    🔥 **실전**: 자산 점검 1순위. 의외로 열린 관리 포트가 곧 침투 경로가 된다.'
  hint: nmap -p 포트 스캔 (대상 192.168.0.161)
  category: recon
  points: 12
  answer: '# 공격 VM(192.168.0.202)에서 실행:

    ssh att@192.168.0.202 ''nmap -p 80,443,8001-8007,9100 192.168.0.161 -T4 --max-retries
    1 2>/dev/null | grep -E "open|PORT"''

    '
  answer_detail: 공인 진입(192.168.0.161)이 노출한 공개 포트(80/443/8001-8007)가 open 으로 보이며, 이것이
    el34 의 외부 노출 공격 표면이다. 9100(API)은 외부 공격자에겐 filtered(미도달)다. 출력에 open 이 포함되면 열린 포트
    발견으로 통과 판정한다.
  expected_output: 'PORT     STATE    SERVICE

    80/tcp   open     http

    443/tcp  open     https

    8001/tcp open     vcom-tunnel

    8002/tcp open     teradataordbms

    8003/tcp open     mcreport

    8004/tcp open     p2pevolvenet

    8005/tcp open     mxi

    8006/tcp open     wpl-analytics

    8007/tcp open     ajp12

    '
  verify:
    type: output_contains
    expect: open
    field: stdout
    semantic:
      intent: 열린 포트 발견
      success_criteria:
      - open 포트
      - 공격 표면
      acceptable_methods:
      - '**[OSS] nmap -p (권장)**'
  target_vm: ips
- order: 3
  instruction: '## 🎯 RED-03 — 문 뒤의 사람 — 서비스·버전 식별


    **전투 맥락:** "열려 있다"에서 한 걸음 — 문 뒤에 **누가** 서 있는지, 어떤 **버전**의 사람인지까지 빼내는 수. nmap -sV가
    Apache httpd 2.4.52라는 이름을 뽑는 순간, 그 버전이 곧 CVE 데이터베이스의 검색 키가 된다.


    **왜:** 버전을 모르면 노릴 후보를 모른다. 실패 부검 — "Apache 오래됐으니까 잘릴 줄 알았는데 안 잘림"은 버전 불일치. 어떤
    CVE를 노릴지 정하지 않은 포트는 그냥 벽이다.


    ## 💻 실행 명령 (한 줄씩 따라 실행)


    **공격 VM:** `ssh att@192.168.0.202` 접속 상태에서 실행한다.

    ```bash

    # 공격 VM(192.168.0.202)에서 실행:

    ssh att@192.168.0.202 ''nmap -sV -p 80,443 192.168.0.161 -T4 --max-retries 1 2>/dev/null
    | grep -E "open|PORT|http"''

    ```

    - `-sV` — "문 열림/닫힘"에서 한 단계 더, **누가 서 있나**까지 읽게 한다.

    - `-p 80,443` — 이미 Red-02에서 열림을 확정한 웹 두 문만. (모든 문에 -sV 하면 시끄러움×N)

    ## ✅ 합격 기준

    `http` 출력. **근거:** VERSION 열에 `Apache httpd`가 보이고 버전 숫자까지 잡히면 식별 성공. 그 문자열이 W02의
    `nmap --script vuln`과 CVE 매핑의 입력이 된다.


    🔥 **실전**: PTES ④ 취약점 분석의 개시점. `2.4.52`로 CVE DB를 여는 행위 자체가 취약점 분석이다.'
  hint: nmap -sV 서비스 버전 (대상 192.168.0.161)
  category: recon
  points: 12
  answer: '# 공격 VM(192.168.0.202)에서 실행:

    ssh att@192.168.0.202 ''nmap -sV -p 80,443 192.168.0.161 -T4 --max-retries 1 2>/dev/null
    | grep -E "open|PORT|http"''

    '
  answer_detail: -sV 옵션으로 서비스/버전을 식별하는 것은 알려진 취약점(CVE) 매핑의 출발점이다. 식별된 버전이 오래됐으면 그
    버전에 공개된 익스플로잇이 곧 침투 후보가 된다. 출력에 http(또는 서비스/버전 단서)가 보이면 통과로 판정한다.
  expected_output: 'Starting Nmap 7.80 ( https://nmap.org ) at 2026-07-05 12:45 UTC

    PORT    STATE SERVICE  VERSION

    80/tcp  open  http     Apache httpd 2.4.52 ((Ubuntu))

    443/tcp open  ssl/http Apache httpd 2.4.52 ((Ubuntu))

    Service detection performed. Please report any incorrect results at https://nmap.org/submit/
    .

    '
  verify:
    type: output_contains
    expect: http
    field: stdout
    semantic:
      intent: 서비스 버전 식별
      success_criteria:
      - http 서비스
      - 버전 단서
      acceptable_methods:
      - '**[OSS] nmap -sV (권장)**'
  target_vm: ips
- order: 4
  instruction: '## 🎯 RED-04 — 간판 열거 — vhost 뒤의 다른 가게


    **전투 맥락:** 같은 80번 문 뒤에도 가게는 한 개인 게 아니다. Host 헤더(=간판)를 바꿔 가며 **가게를 열거**해야 표면이 완성된다.
    그리고 dvwa와 juice의 **답이 다르다**는 것이 곧 WAF가 두 가게를 다르게 취급한다는 증거다.


    **왜:** 문을 열면 바로 앱으로 뛰어드는 공격자는 1개 가게만 본다. 실패 부검 — "저기 관리자 콘솔이 숨어 있었다"는 대개 잊힌 vhost.
    간판을 열거하지 않는 사람만 그렇게 당한다.


    ## 💻 실행 명령 (한 줄씩 따라 실행)


    **공격 VM:** `ssh att@192.168.0.202` 접속 상태에서 실행한다.

    ```bash

    # 공격 VM(192.168.0.202)에서 실행:

    ssh att@192.168.0.202 ''whatweb -a1 http://dvwa.el34.lab/''

    ssh att@192.168.0.202 ''whatweb -a1 http://juice.el34.lab/''

    ```

    > 💡 브라우저에서 `http://dvwa.el34.lab/`와 `http://juice.el34.lab/`을 열면 같은 IP·포트인데도 **서로
    다른 앱**이 뜬다. CLI로 whatweb이 그 차이를 한 줄로 지문한다.

    ## ✅ 합격 기준

    `Apache` 출력. **근거:** whatweb이 Server(Apache) + 응답코드 + 기술 스택을 지문하면 성공. dvwa 403
    vs juice 200의 **차가** 곧 WAF 정책의 경계선 — W03에서 그 경계를 본격적으로 긁어본다.


    🔥 **실전**: 숨은 vhost(관리자 콘솔 등)가 가장 약한 고리인 경우가 많다 — W02의 ffuf가 바로 이 문을 여는 도구다.'
  hint: whatweb -a1 로 vhost별 서버·타이틀 지문 (대상 192.168.0.161)
  category: recon
  points: 12
  answer: '# 공격 VM(192.168.0.202)에서 실행:

    ssh att@192.168.0.202 ''whatweb -a1 http://dvwa.el34.lab/''

    ssh att@192.168.0.202 ''whatweb -a1 http://juice.el34.lab/''

    '
  answer_detail: whatweb 으로 Server 헤더와 응답 코드·타이틀을 지문하면 웹 서버 종류·버전(Apache)과 앱을 알 수
    있고, 호스트명을 dvwa/juice 로 바꾸면 vhost별로 다른 앱(dvwa 403 차단 vs juice 200 Juice Shop)이
    응답함을 확인한다. 각 vhost 가 서로 다른 익스플로잇 표면이므로 빠짐없이 열거할수록 표면이 넓어진다. 출력에 Apache/Server
    지문이 보이면 통과 판정한다.
  expected_output: 'http://dvwa.el34.lab/ [403 Forbidden] Apache[2.4.52], HTTPServer[Ubuntu
    Linux][Apache/2.4.52 (Ubuntu)], IP[192.168.0.161], Title[403 Forbidden]

    http://juice.el34.lab/ [200 OK] Apache[2.4.52], HTML5, HTTPServer[Ubuntu Linux][Apache/2.4.52
    (Ubuntu)], IP[192.168.0.161], Title[OWASP Juice Shop], X-Frame-Options[SAMEORIGIN]

    '
  verify:
    type: output_contains
    expect: Apache
    field: stdout
    semantic:
      intent: 웹 기술 스택 핑거프린팅
      success_criteria:
      - Server 헤더/응답
      - vhost별 앱
      acceptable_methods:
      - '**[OSS] whatweb 지문 (권장)**'
