    ## 4. 방어 가시성: 내 스캔이 Suricata에 출발지 192.168.0.202로 탐지 → 회피 고려(느린/분산 스캔)

    ## 결론: 정찰로 공격 표면을 매핑. 다음 단계는 표면별 취약점 분석·익스플로잇

    '
  verify:
    type: output_contains
    expect: 정찰
    field: stdout
    semantic:
      intent: 정찰 종합 보고
      success_criteria:
      - 포트/스택/표면
      - 방어 가시성
      acceptable_methods:
      - '**[관리적] 정찰 보고서 (권장)**'
  target_vm: web
