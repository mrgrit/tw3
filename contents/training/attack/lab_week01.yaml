- order: 5
  instruction: '## 🎯 RED-05 — CCTV 열기 — 방금,내가 몇 건에 찍혔나


    **전투 맥락:** 지금 화면을 바꿔라. IPS(`10.20.31.2`)로 SSH. 방금 네가 보낸 패킷이 **네 IP(192.168.0.202)로
    몇 건의 alert**가 되었는지 — 스스로의 눈으로 본다. el34는 SNAT하지 않으므로 출처 IP가 그대로 보존된다.


    **왜:** 자기 지문을 모르는 공격자는 없다. 이 숫자가 다음 주차(탐지 회피)의 기준값이다. 100건이면 "매우 시끄러운 스캔" — 실전이면
    1분도 안 돼 차단될 IP. 이걸 몰랐다면 W02의 느린 스캔도 "느리면 되겠지" 수준에서 끝난다.


    ## 💻 실행 명령 (한 줄씩 따라 실행)


    **방어자 화면:** 공격 VM에서 나와 IPS 장비에 접속 — `ssh ccc@10.20.31.2`(비밀번호 `1`).

    ```bash

    # 방어자 시선(IPS 장비 10.20.31.2)에서 실행:

    # 1) eve.json에서 alert+내 출발지(192.168.0.202)만 골라 출발지 집계(내 정찰 탐지 확인)

    ssh ccc@10.20.31.2 ''tail -2000 /var/log/suricata/eve.json | jq -rc "select(.event_type==\"alert\"
    and .src_ip==\"192.168.0.202\")|.src_ip" | sort | uniq -c''

    # 2) 내 스캔이 무슨 시그니처로 탐지됐는지(예: Nmap/SCAN)

    ssh ccc@10.20.31.2 ''tail -2000 /var/log/suricata/eve.json | jq -rc "select(.event_type==\"alert\"
    and .src_ip==\"192.168.0.202\")|.alert.signature" | sort | uniq -c | tail -3''

    # 3) 해석 — 내 스캔이 출발지 192.168.0.202로 탐지됨, 회피는 느린(-T2)/분산 스캔(고급)

    ```

    - `tail -2000` — alert는 flow에 비해 드물어 깊게 파야 잡힌다.

    - `.src_ip=="192.168.0.202"` — **네 얼굴**로 grep 하는 것과 같다.

    - `.alert.signature` — 방어자가 네 행동에 붙인 **이름**. `Nmap`이면 nmap, `SCAN`이면 스캔. 실전이면
    그 이름을 보는 순간 블록 리스트에 네 IP가 오른다.

    ## ✅ 합격 기준

    `192.168.0.202` 출력. **근거:** 출발지 192.168.0.202의 alert가 100건 넘게 쌓였다는 뜻은, 방금 Red-02/03에서
    보낸 nmap 스캔이 전부 시그니처에 걸렸다는 것이다. 시그니처에 `Nmap`/`SCAN`이 보이면 — "스캔으로 분류"의 공식 선고.


    🔥 **실전**: 레드팀의 자가 점검: 오늘 내 IP가 방어 alert 몇 건을 만들었나. 그 숫자가 탐지 회피 설계의 기준값.'
