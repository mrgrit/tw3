  instruction: '## 🎯 RED-07 — PTES + RoE — 순서와 경계를 내 말로


    **전투 맥락:** 명령을 외우는 것과 순서를 아는 것, 그리고 경계를 아는 것은 전혀 다른 세 가지다. 이 한 수는 그 세 가지가 **네
    말**로 나오는지 확인하는 것 — 시험이 아니라 자기 점검이다.


    **왜:** PTES를 건너뛰면 "무엇이 열렸는지도 모른 채 시끄럽게 난사"가 된다. RoE를 어기면 합법적 평가가 **사건**으로 바뀐다(정보통신망법,
    정보시스템의 무단 접속죄). 둘 다 "순서/경계를 아는 사람"이 저지르는 사고다.


    ## 💻 실행 명령 (한 줄씩 따라 실행)


    **공격 VM:** 192.168.0.202에서 정리.

    ```bash

    echo "PTES 6단계: ① 정찰(Intelligence Gathering) ← 이번 주 ② 위협모델링 ③ 취약점분석 ④ 익스플로잇 ⑤
    포스트익스플로잇 ⑥ 보고"

    echo "RoE 4요소: 범위(어디까지)·시간(언제)·방법(무엇 금지)·증거(기록). 인가된 대상(192.168.0.161)만, 무단 공격
    불법"

    ```

    - PTES 6단계 — 본 주차가 ① 정찰에 해당.

    - RoE 4요소 — **범위**(어디까지)·**시간**(언제)·**방법**(무엇 금지)·**증거**(기록).

    ## ✅ 합격 기준

    `PTES` 출력. **근거:** 6단계와 4요소를 **본인 말로** 정리하면 통과. 도구보다 중요한 것은 방법론의 소유다.


    🔥 **실전**: 실무 침투 테스트는 RoE 합의서(PDF, 서명)의 서명부터 시작한다. 서명 없이는 패킷 하나도 못 보낸다.'
